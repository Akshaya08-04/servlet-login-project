<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
</head>
<body>

<h2>Login Page - UC4</h2>

<form action="LoginServlet" method="post">
    Username:
    <input type="text" name="user" placeholder="Starts with capital, min 3 chars">
    <br><br>

    Password:
    <input type="password" name="pwd" placeholder="Min 8, 1 uppercase, 1 number, 1 special char">
    <br><br>

    <input type="submit" value="Login">
</form>

</body>
</html>
